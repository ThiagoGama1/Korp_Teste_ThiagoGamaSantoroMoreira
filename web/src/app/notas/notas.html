<mat-card class="cartao">
  <mat-card-header>
    <mat-card-title>Notas fiscais</mat-card-title>
    <span class="espaco"></span>
    <button mat-icon-button (click)="carregar()" aria-label="Recarregar">
      <mat-icon>refresh</mat-icon>
    </button>
    <button mat-flat-button (click)="criar()" [disabled]="criando()">
      <mat-icon>add</mat-icon>
      {{ criando() ? 'Criando...' : 'Nova nota' }}
    </button>
  </mat-card-header>

  @if (carregando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card-content>
    @if (!carregando() && notas().length === 0) {
      <p class="vazio">Nenhuma nota criada ainda.</p>
    } @else {
      <table mat-table [dataSource]="notas()">
        <ng-container matColumnDef="numero">
          <th mat-header-cell *matHeaderCellDef>Número</th>
          <td mat-cell *matCellDef="let nota">#{{ nota.numero }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let nota">
            <span class="etiqueta" [class.fechada]="nota.status === 'FECHADA'">
              {{ nota.status }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="itens">
          <th mat-header-cell *matHeaderCellDef>Itens</th>
          <td mat-cell *matCellDef="let nota">{{ totalDeItens(nota) }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let nota">
            <button mat-button (click)="abrir(nota)">Abrir</button>
            @if (podeApagar(nota)) {
              <button mat-icon-button (click)="remover(nota)" aria-label="Apagar nota">
                <mat-icon>delete_outline</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let linha; columns: colunas"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
