server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular é uma SPA: as rotas (/notas/1, /produtos) existem só no navegador,
    # não como arquivos no disco. Sem este try_files, recarregar a página em
    # qualquer rota que não a raiz devolveria 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos com hash no nome são imutáveis: se o conteúdo mudar, o nome
    # muda junto. Então podem ser cacheados para sempre com segurança.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
